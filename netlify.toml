[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

  # Netlify's build-output secrets scanner matches env-var VALUES
  # against every committed file. Our public contact email
  # (aratanutra@gmail.com) also happens to be the value of ADMIN_EMAIL
  # and ADMIN_ALERT_EMAIL, so every legitimate occurrence in
  # content/site-content.json + policy pages trips the scanner.
  # ADMIN_PASSWORD_HASH gets false-positived when its bcrypt string
  # embeds in the Next.js server-runtime trace. All three are
  # server-only, never inlined into the client bundle, so omitting
  # them from the scan is safe.
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_EMAIL,ADMIN_ALERT_EMAIL,ADMIN_PASSWORD_HASH"

# The official @netlify/plugin-nextjs is installed automatically by Netlify
# when it detects a Next.js project, so we do not need to declare it here.
# It serves App Router pages, API routes, middleware (NextAuth) and Image
# Optimization on Netlify Functions / Edge Functions.

# Long-cache the build assets that Next.js fingerprints
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/seed/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Baseline security headers applied to every response served by Netlify's
# CDN (mirrors what next.config.mjs adds through the Next runtime, so any
# static file Netlify serves without the plugin still gets the same
# hardening).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self \"https://checkout.razorpay.com\"), interest-cohort=()"
    X-DNS-Prefetch-Control = "on"
