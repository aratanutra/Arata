[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# The official @netlify/plugin-nextjs is installed automatically by Netlify
# when it detects a Next.js project, so we do not need to declare it here.
# It serves App Router pages, API routes, middleware (NextAuth) and Image
# Optimization on Netlify Functions / Edge Functions.

# Long-cache the build assets that Next.js fingerprints
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/seed/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Baseline security headers applied to every response served by Netlify's
# CDN (mirrors what next.config.mjs adds through the Next runtime, so any
# static file Netlify serves without the plugin still gets the same
# hardening).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self \"https://checkout.razorpay.com\"), interest-cohort=()"
    X-DNS-Prefetch-Control = "on"
