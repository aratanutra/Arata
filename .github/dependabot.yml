version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    reviewers:
      - "aratanutra"
    groups:
      # Bundle non-security patch / minor updates so we don't drown in
      # tiny PRs. Security updates still open on their own so they get
      # attention quickly.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pinned by product decision — bump only through explicit PR.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # react-three trio + eslint majors are held — they need code
      # migrations, not just a lockfile bump.
      - dependency-name: "@react-three/drei"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-three/fiber"
        update-types: ["version-update:semver-major"]
      - dependency-name: "three"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # eslint-config-next tracks next's major; hold until next itself
      # is upgraded (also held above).
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      # typescript 6+ requires code + tsconfig changes; hold.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 is a from-scratch rewrite (CSS-based config); hold
      # until a proper migration PR touches globals.css + tailwind.config.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # @types/node majors mirror Node LTS releases; only bump when the
      # actual runtime moves (Netlify config).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
